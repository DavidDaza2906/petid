name: keepalive

# Supabase free pausa los proyectos inactivos (~1 semana sin actividad).
# Este ping diario mantiene despierto el proyecto y avisa si la app se cae.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ vars.PETID_BASE_URL || 'https://petid-eight.vercel.app' }}
    steps:
      - name: Ping a la app
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w "  $BASE/ -> %{http_code}\n" "$BASE/"

      - name: Despertar la base de datos
        run: |
          set -euo pipefail
          # Una ficha inexistente: la API consulta Postgres y responde 404.
          # El 404 es el resultado esperado (una peticion que toca la base = actividad).
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/pets/__keepalive__")
          echo "  lectura a la base -> $CODE"
          if [ "$CODE" != "404" ] && [ "$CODE" != "200" ]; then
            echo "Respuesta inesperada: la API o la base no estan sanas"
            exit 1
          fi
