name: keepalive

# Supabase free pausa los proyectos inactivos (~1 semana sin actividad).
# Este ping diario mantiene despierto el proyecto y avisa si la app se cae.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app + una ficha pública
        run: |
          set -euo pipefail
          BASE="${{ vars.PETID_BASE_URL || 'https://petid.vercel.app' }}"
          echo "Ping $BASE/"
          curl -fsS -o /dev/null -w "  / -> %{http_code}\n" "$BASE/"
          echo "Ping Supabase via una ficha"
          curl -fsS -o /dev/null -w "  /pet/mila -> %{http_code}\n" "$BASE/pet/mila"
