<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR del collar — PETID</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar"><a href="/" class="brand">PETID</a></header>
<main>
  <section class="card no-print">
    <h1>QR del collar</h1>
    <p class="muted" id="subtitle">Cargando…</p>
  </section>

  <section class="card qr-wrap" id="card" hidden>
    <div class="tile">
      <p class="cut">Si me encuentras, escanéame<small>Así avisas a mi familia</small></p>
      <img id="qr" class="qr-code" alt="Código QR de la ficha" width="320" height="320">
      <p class="cut" id="pet-name"></p>
      <p class="muted small">O visita: <code id="url"></code></p>
    </div>
    <div class="actions no-print">
      <a class="btn" id="download" download>Descargar PNG</a>
      <button class="btn ghost" id="print" type="button">Imprimir</button>
    </div>
    <p class="muted small no-print" id="hint">Imprime en tamaño carnet (5×5 cm) y engrápalo o plastifícalo junto a la placa del collar.</p>
  </section>

  <section class="card no-print" id="problem-card" hidden>
    <div class="notice bad" id="problem"></div>
  </section>
</main>

<script type="module">
const params = new URLSearchParams(location.search);
const slug = (params.get("slug") || location.pathname.split("/")[2] || "").trim();
const publicUrl = () => `${location.origin.replace(/\/+$/, "")}/pet/${encodeURIComponent(slug)}`;
// El QR lo dibuja el servidor con la libreria `qrcode` (MIT): aqui no hay CDN del
// que dependa la imagen, solo un <img> contra nuestra propia API.
const qrUrl = () => `/api/qr/${encodeURIComponent(slug)}`;

const el = (id) => document.getElementById(id);

function fail(message) {
  el("problem").textContent = message;
  el("problem-card").hidden = false;
  el("subtitle").textContent = "No se pudo generar el QR.";
}

async function petName() {
  try {
    const response = await fetch(`/api/pets/${encodeURIComponent(slug)}`);
    if (response.status === 404) return { missing: true };
    if (response.ok) return { name: (await response.json()).pet.name };
  } catch {
    // Si la API falla, el QR sigue siendo valido: solo perdemos el nombre bonito.
  }
  return {};
}

async function init() {
  if (!slug) return fail("Falta el slug de la mascota en la URL.");

  const { missing, name = slug } = await petName();
  if (missing) return fail(`La ficha /${slug} no existe.`);

  const url = publicUrl();
  const qr = el("qr");
  const download = el("download");

  qr.addEventListener("error", () => {
    el("hint").textContent =
      `No se pudo cargar la imagen del QR. El enlace que debe llevar es: ${url}`;
  });

  qr.src = qrUrl();
  download.href = `${qrUrl()}?download=1`;
  download.setAttribute("download", `petid-qr-${slug}.png`);
  el("url").textContent = url;
  el("pet-name").textContent = name;
  document.title = `QR de ${name} — PETID`;
  el("subtitle").textContent = `QR de ${name}, apuntando a ${url}`;
  el("card").hidden = false;

  el("print").addEventListener("click", () => window.print());
}

init();
</script>
</body>
</html>
